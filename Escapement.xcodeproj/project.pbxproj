			shellScript = "set -e\nidentity=\"${EXPANDED_CODE_SIGN_IDENTITY:-$CODE_SIGN_IDENTITY}\"\n# Штамп времени нужен только дистрибутиву: в Debug это лишний поход\n# к серверу Apple на каждый фреймворк.\nstamp=()\n[ \"$CONFIGURATION\" = \"Release\" ] && stamp=(--timestamp)\nframeworks=\"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH\"\nif [ -d \"$frameworks\" ]; then\n  for framework in \"$frameworks\"/*.framework; do\n    [ -e \"$framework\" ] || continue\n    # Изнутри наружу: Sparkle прячет Updater.app, Autoupdate и XPC-сервисы,\n    # подпись фреймворка снаружи до них не достаёт — нотаризация такие\n    # бинари отвергает («not signed with a valid Developer ID»).\n    # Сначала все Mach-O, затем вложенные бандлы, затем сам фреймворк:\n    # каждый контейнер запечатывает уже подписанное содержимое.\n    while IFS= read -r -d '' macho; do\n      file -b \"$macho\" | grep -q \"Mach-O\" || continue\n      codesign --force --sign \"$identity\" --options runtime \"${stamp[@]}\" \"$macho\"\n    done < <(find \"$framework\" -depth -type f -perm -u+x -print0)\n    while IFS= read -r -d '' inner; do\n      codesign --force --sign \"$identity\" --options runtime \"${stamp[@]}\" \"$inner\"\n    done < <(find \"$framework\" -depth \\( -name \"*.app\" -o -name \"*.xpc\" \\) -print0)\n    codesign --force --sign \"$identity\" --options runtime \"${stamp[@]}\" \"$framework\"\n  done\nfi\n# Debug-сборки кладут рядом с бинарём Escapement.debug.dylib —\n# без подписи он валит codesign всего бандла.\nfor dylib in \"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH\"/*.dylib; do\n  [ -e \"$dylib\" ] || continue\n  codesign --force --sign \"$identity\" \"${stamp[@]}\" \"$dylib\"\ndone\n";
		};
