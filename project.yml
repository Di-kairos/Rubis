# XcodeGen manifest — source of truth for Escapement.xcodeproj.
# Regenerate after edits: xcodegen generate
name: Escapement
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Escapement.xcconfig
  Release: Config/Escapement.xcconfig
packages:
  EscapementCore:
    path: Packages/EscapementCore
  PlaybackEngine:
    path: Packages/PlaybackEngine
  MusicLibrary:
    path: Packages/MusicLibrary
  SubsonicKit:
    path: Packages/SubsonicKit
  DesignSystem:
    path: Packages/DesignSystem
targets:
  Escapement:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
    dependencies:
      - package: EscapementCore
      - package: PlaybackEngine
      - package: MusicLibrary
      - package: SubsonicKit
      - package: DesignSystem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      # Бинарные фреймворки декодеров приезжают из SPM уже подписанными чужим
      # Team ID. С ad-hoc подписью приложения и hardened runtime dyld отказывается
      # их грузить («different Team IDs») и приложение падает на старте.
      # Переподписываем всё одной идентичностью после сборки.
      - name: Re-sign embedded frameworks ad-hoc
        basedOnDependencyAnalysis: false
        script: |
          set -e
          frameworks="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          [ -d "$frameworks" ] || exit 0
          for framework in "$frameworks"/*.framework; do
            [ -e "$framework" ] || continue
            codesign --force --sign - --options runtime "$framework"
          done
          codesign --force --sign - --options runtime \
            --entitlements "$SRCROOT/$CODE_SIGN_ENTITLEMENTS" \
            "$TARGET_BUILD_DIR/$WRAPPER_NAME"
