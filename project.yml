# XcodeGen manifest — source of truth for Escapement.xcodeproj.
# Regenerate after edits: xcodegen generate
name: Escapement
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Escapement.xcconfig
  Release: Config/Escapement.xcconfig
packages:
  # 4-я внешняя зависимость сверх SPEC §3.2 — одобрена владельцем (D-005):
  # autoupdate через Sparkle, фид в публичном репо rubis-releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  EscapementCore:
    path: Packages/EscapementCore
  PlaybackEngine:
    path: Packages/PlaybackEngine
  MusicLibrary:
    path: Packages/MusicLibrary
  SubsonicKit:
    path: Packages/SubsonicKit
  DesignSystem:
    path: Packages/DesignSystem
targets:
  Escapement:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - "Info.plist"
    # Sparkle (D-005): фид и ключ подписи апдейтов. Остальной plist
    # генерируется как раньше — Xcode мержит файл с INFOPLIST_KEY_*.
    info:
      path: App/Info.plist
      properties:
        SUFeedURL: https://raw.githubusercontent.com/Di-kairos/rubis-releases/main/appcast.xml
        SUPublicEDKey: B9ET1V4F1uNjHOjG+kJROT8Z1oajNxBbAX9UNrQ/sjg=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
    dependencies:
      - package: EscapementCore
      - package: PlaybackEngine
      - package: MusicLibrary
      - package: SubsonicKit
      - package: DesignSystem
      - package: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Xcode подмешивает отладочный com.apple.security.get-task-allow в
          # подпись обычной сборки — нотаризация с ним отказывает. В Debug он
          # нужен (иначе не подцепиться отладчиком), поэтому только Release.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      # Бинарные фреймворки декодеров приезжают из SPM подписанными чужим
      # Team ID: с hardened runtime dyld отказывается их грузить («different
      # Team IDs») и приложение падает на старте. Переподписываем их той же
      # идентичностью, что и приложение — тогда Team ID сходится, а нотаризация
      # видит Developer ID на КАЖДОМ вложенном бинаре (ad-hoc она отвергает).
      # Сам бандл подписывает Xcode штатной фазой, она идёт после скриптов.
      - name: Re-sign embedded frameworks with the app identity
        basedOnDependencyAnalysis: false
        # bash: скрипт использует process substitution, /bin/sh её не знает.
        shell: /bin/bash
        script: |
          set -e
          identity="${EXPANDED_CODE_SIGN_IDENTITY:-$CODE_SIGN_IDENTITY}"
          # Штамп времени нужен только дистрибутиву: в Debug это лишний поход
          # к серверу Apple на каждый фреймворк.
          stamp=()
          [ "$CONFIGURATION" = "Release" ] && stamp=(--timestamp)
          frameworks="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          if [ -d "$frameworks" ]; then
            for framework in "$frameworks"/*.framework; do
              [ -e "$framework" ] || continue
              # Изнутри наружу: Sparkle прячет Updater.app, Autoupdate и XPC-сервисы,
              # подпись фреймворка снаружи до них не достаёт — нотаризация такие
              # бинари отвергает («not signed with a valid Developer ID»).
              # Сначала все Mach-O, затем вложенные бандлы, затем сам фреймворк:
              # каждый контейнер запечатывает уже подписанное содержимое.
              while IFS= read -r -d '' macho; do
                file -b "$macho" | grep -q "Mach-O" || continue
                codesign --force --sign "$identity" --options runtime "${stamp[@]}" "$macho"
              done < <(find "$framework" -depth -type f -perm -u+x -print0)
              while IFS= read -r -d '' inner; do
                codesign --force --sign "$identity" --options runtime "${stamp[@]}" "$inner"
              done < <(find "$framework" -depth \( -name "*.app" -o -name "*.xpc" \) -print0)
              codesign --force --sign "$identity" --options runtime "${stamp[@]}" "$framework"
            done
          fi
          # Debug-сборки кладут рядом с бинарём Escapement.debug.dylib —
          # без подписи он валит codesign всего бандла.
          for dylib in "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"/*.dylib; do
            [ -e "$dylib" ] || continue
            codesign --force --sign "$identity" "${stamp[@]}" "$dylib"
          done
